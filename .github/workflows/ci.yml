name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # 同一分支/PR 推新提交时，老的 verify/desktop 跑一半直接取消，不占并发名额

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 实测最大 145s(2.4min)，上浮 ≥50% 留量级余量（含 xvfb 冒烟测试，偶发慢一档也不误杀）
    steps:
      - name: 检出源码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: 校验源码并构建发布产物
        run: bash scripts/release.sh --build-only

      - name: 固定桌面端 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装桌面端依赖
        working-directory: desktop
        run: npm ci

      - name: 审计 Electron 运行时依赖
        # `npm audit --omit=dev`（下一步 typecheck/package 用不到，但发版清单里那条 `npm audit --omit=dev`
        # 结构性看不到 electron——它按 npm 惯例总是 devDependency。见 scripts/audit-runtime.mjs 文件头注释。
        working-directory: desktop
        run: node scripts/audit-runtime.mjs

      - name: 测试桌面端
        working-directory: desktop
        run: npm test

      - name: 检查桌面端类型
        working-directory: desktop
        run: npm run typecheck

      - name: 构建桌面端目录
        working-directory: desktop
        run: npm run package

      - name: 配置 Linux Chromium 沙箱
        working-directory: desktop
        run: |
          sudo chown root:root "out/PolyAsk-linux-x64/chrome-sandbox"
          sudo chmod 4755 "out/PolyAsk-linux-x64/chrome-sandbox"

      - name: 冒烟测试桌面端运行时
        working-directory: desktop
        run: xvfb-run -a npm run smoke -- --skip-package

  desktop-cross-platform:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # 实测最大 122s(2.03min，Windows)，上浮 ≥50% 留量级余量
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: 检出源码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: 固定 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        working-directory: desktop
        run: npm ci

      - name: 测试
        working-directory: desktop
        run: npm test

      - name: 检查类型
        working-directory: desktop
        run: npm run typecheck

      - name: 构建当前平台应用目录
        working-directory: desktop
        run: npm run package

      - name: 构建并解包校验 Windows 便携版
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: ./scripts/archive-portable.ps1 -Arch "x64" -DestinationPath "out/ci/PolyAsk-windows-x64-portable.zip"
