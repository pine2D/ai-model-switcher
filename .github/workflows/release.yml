name: Release

# 推送 v* 标签后发布五个无签名 Desktop 预览包（各附 .sha256）与 CHANGELOG 说明。
# 本地入口：prepare-release.sh 准备版本 → release.sh --publish 做 exact-HEAD CI 门禁并推 tag。
# 手动触发（workflow_dispatch，dry_run 默认 true）会走完 validate → desktop → 汇总核对，但不创建 Release——
# 不消耗版本号就能验证整条发布链；tag 一旦推出不可覆盖，任何 workflow 改动先用它跑一遍。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建与核对资产，不创建 GitHub Release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # publish 半途失败要能重跑补齐；取消在制品会让发布产物半成品

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # gh 校验实测 <10s；加上 release.sh --build-only（ci.yml verify 作业实测 ≤145s 含 desktop 段）后仍留量级余量
    permissions:
      contents: read
      actions: read # gh run list 查 CI 结论必需；顶层降权后这里必须显式保留，否则误判「无记录」exit 1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Release 正文是 tag 不可覆盖的产物，与 ci.yml 同口径钉在 .nvmrc 的 Node 上产出；validate 不跑 npm ci，无需 cache。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: desktop/.nvmrc

      - name: 校验 tag 来自已通过 CI 的 main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main" || {
            echo "::error::tag 提交不在 origin/main 上"
            exit 1
          }
          CI_RESULT=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "CI" \
            --commit "$GITHUB_SHA" \
            --limit 1 \
            --json conclusion,status \
            --jq '.[0] | "\(.status):\(.conclusion)"')
          [ "$CI_RESULT" = "completed:success" ] || {
            echo "::error::当前提交没有成功完成的 CI（实际：${CI_RESULT:-无记录}）"
            exit 1
          }

      # Release 正文在这里产出，不再依赖 extension 作业——扩展退役后 publish 的 body_path 仍有来源。
      - name: 校验源码并提取 Release 正文
        run: bash scripts/release.sh --build-only

      - name: 暂存 Release 正文
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: dist/release-notes.md
          if-no-files-found: error

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            maker: "@electron-forge/maker-squirrel"
            asset: windows-x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            maker: "@electron-forge/maker-deb"
            asset: linux-x64
          - os: macos-latest
            platform: darwin
            arch: x64
            maker: "@electron-forge/maker-zip"
            asset: macos-x64
          - os: macos-latest
            platform: darwin
            arch: arm64
            maker: "@electron-forge/maker-zip"
            asset: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # 实测最大值（Windows Squirrel + 便携版打包）约 167s=2.8min，上浮 ≥50% 留量级余量
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装 Linux maker 依赖
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: 安装 Desktop 依赖
        working-directory: desktop
        run: npm ci

      - name: 写入 Desktop OAuth 客户端凭据
        working-directory: desktop
        env:
          POLYASK_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.POLYASK_GOOGLE_DESKTOP_CLIENT_ID }}
          POLYASK_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.POLYASK_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: npm run configure-oauth

      - name: 构建当前平台可分发包
        working-directory: desktop
        run: npm run make -- --platform="${{ matrix.platform }}" --arch="${{ matrix.arch }}" --targets="${{ matrix.maker }}"

      - name: 构建并解包校验 Windows 便携版
        if: matrix.platform == 'win32'
        working-directory: desktop
        shell: pwsh
        run: |
          $version = (Get-Content "package.json" | ConvertFrom-Json).version
          $zipDirectory = "out/make/zip/win32/${{ matrix.arch }}"
          $zipPath = "$zipDirectory/PolyAsk-win32-${{ matrix.arch }}-$version.zip"
          ./scripts/archive-portable.ps1 -Arch "${{ matrix.arch }}" -DestinationPath $zipPath

      - name: 规范化文件名并生成 SHA-256
        working-directory: desktop
        run: npm run collect-release -- "${{ matrix.platform }}" "${{ matrix.arch }}"

      - name: 暂存 Desktop 发布资产
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-desktop-${{ matrix.asset }}
          path: desktop/release/*
          if-no-files-found: error

  publish:
    needs: [validate, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 实测最大 28s；这里需要真正的 contents: write 来发布 Release
    permissions:
      contents: write
    steps:
      - name: 汇总发布资产
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      # 与下面 files 同一 glob：dry_run 时这一步就是终点，真发版时它先于 action-gh-release 把缺资产暴露成可读的清单。
      - name: 核对 Release 正文与资产
        run: |
          [ -s release-assets/release-notes.md ] || { echo "::error::release-notes.md 缺失或为空"; exit 1; }
          echo "--- release-notes.md ---"; cat release-assets/release-notes.md; echo "--- 资产 ---"
          ls -1 release-assets/polyask-desktop-* || { echo "::error::没有匹配到任何 polyask-desktop-* 资产"; exit 1; }
          count=$(ls -1 release-assets/polyask-desktop-* | grep -vc '\.sha256$')
          [ "$count" -eq 5 ] || { echo "::error::Desktop 包应为 5 个，实际 $count 个"; exit 1; }

      - name: 发布 Desktop 预览包
        # 手动触发即使取消 dry_run 也不得从分支 ref 创建 Release：action 会拒绝，但这里先挡住，别让它跑到最后一步才失败。
        if: inputs.dry_run != true && github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release-assets/polyask-desktop-*
          body_path: release-assets/release-notes.md
          fail_on_unmatched_files: true
