<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title data-i18n="arc_title">PolyAsk</title>
<script src="../i18n.js"></script>
<script src="theme.js"></script>
<link rel="icon" href="../icons/icon32.png">
<link rel="stylesheet" href="console.css">
<link rel="stylesheet" href="archive.css"></head>
<body class="archive">
  <div id="ar-head">
    <div class="t"><svg class="logo lucide lucide-archive" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="5" x="2" y="3" rx="1" /><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8" /><path d="M10 12h4" /></svg> <span data-i18n="arc_title">结果归档</span></div>
    <span id="ar-status" role="status" aria-live="polite"></span>
    <button id="ar-capture" data-i18n="arc_capture">保存当前结果</button>
    <button id="ar-copy" data-i18n="arc_copy" disabled>复制</button>
    <button id="ar-export" data-i18n="arc_export" disabled>导出 .md</button>
    <button id="ar-del" data-i18n="arc_del" disabled>删除</button>
  </div>
  <div id="ar-body">
    <div id="ar-library">
      <div id="ar-search-row">
        <input id="ar-search" type="search" data-i18n-ph="arc_searchPh" data-i18n-aria="arc_searchAria">
        <button id="ar-favorites" type="button" aria-pressed="false" data-i18n="arc_favorites">收藏</button>
      </div>
      <select id="ar-tag" data-i18n-aria="arc_tagFilter"><option value="" data-i18n="arc_allTags">全部标签</option></select>
      <div id="ar-list" role="listbox" data-i18n-aria="arc_listAria" aria-label="归档条目"></div>
      <button id="ar-more" type="button" hidden data-i18n="arc_more">加载更多</button>
    </div>
    <div id="ar-detail"></div>
  </div>
  <script src="sites.js"></script>
  <script src="archive-detail.js"></script>
  <script src="archive.js"></script>
</body></html>
