<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PolyAsk</title>
<link rel="stylesheet" href="popup.css">
<script src="../console/theme.js"></script>
<script src="../i18n.js"></script>
<script src="../console/sites.js"></script>
</head>
<body>
<main id="app">
  <header class="head">
    <div class="brand"><svg data-brand-icon viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 1.5 14.5 8 8 14.5 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 5.4 10.6 8 8 10.6 5.4 8z" fill="currentColor"/></svg>PolyAsk</div>
    <div id="site-status" class="status checking"><i class="status-dot"></i><span id="status-text" data-i18n="pop_detecting">检测中…</span></div>
  </header>
  <button id="open-console"><svg data-brand-icon viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1.5 14.5 8 8 14.5 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 5.4 10.6 8 8 10.6 5.4 8z" fill="currentColor"/></svg><span data-i18n="pop_openConsole">打开群发控制台</span><span class="arrow" aria-hidden="true">›</span></button>
  <div class="modebar">
    <div class="section-label" data-i18n="pop_modeLabel">模型模式</div>
    <div class="segment" role="group" data-i18n-aria="pop_modeLabel" aria-label="模型模式">
      <button id="think" aria-pressed="false"><span data-i18n="pop_thinkShort">深思</span></button>
      <button id="fast" aria-pressed="false"><span data-i18n="pop_fastShort">快速</span></button>
    </div>
  </div>
  <div id="unsupported" data-i18n="pop_unsupported">档位切换需在 AI 站点页使用（群发控制台不受影响）</div>
  <div id="keys"></div>
  <section id="console-keys" class="console-keys" aria-labelledby="console-keys-title">
    <div id="console-keys-title" class="shortcut-title" data-i18n="pop_consoleKeys">控制台内快捷键</div>
    <div class="console-key-grid">
      <div class="console-key"><span data-i18n="pop_keyCollect">汇总复制</span><kbd>Alt+C</kbd></div><div class="console-key"><span data-i18n="pop_keyTile">平铺窗口</span><kbd>Alt+L</kbd></div>
      <div class="console-key"><span data-i18n="pop_keyNew">开启新会话</span><kbd>Alt+N</kbd></div><div class="console-key"><span data-i18n="pop_keyPrompt">聚焦输入框</span><kbd>Alt+P</kbd></div>
      <div class="console-key"><span data-i18n="pop_keyRetry">重试失败站点</span><kbd>Alt+R</kbd></div>
    </div>
  </section>
  <div class="tools">
    <button id="shortcut-help" class="tool" data-i18n-title="pop_manageShortcuts" data-i18n-aria="pop_manageShortcuts"><svg aria-hidden="true" class="lucide lucide-keyboard" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8h.01" /><path d="M12 12h.01" /><path d="M14 8h.01" /><path d="M16 12h.01" /><path d="M18 8h.01" /><path d="M6 8h.01" /><path d="M7 16h10" /><path d="M8 12h.01" /><rect width="20" height="16" x="2" y="4" rx="2" /></svg></button>
    <button id="diag" class="tool" data-i18n-title="pop_diagShort" data-i18n-aria="pop_diagShort"><svg aria-hidden="true" class="lucide lucide-activity" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" /></svg></button>
    <button id="open-settings" class="tool" data-i18n-title="pop_settings" data-i18n-aria="pop_settings"><svg aria-hidden="true" class="lucide lucide-settings" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /><circle cx="12" cy="12" r="3" /></svg></button>
  </div>
  <div id="diagout"></div>
</main>
<script src="popup.js"></script>
</body></html>
